<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT & MOON Mystery Box</title>

    <!-- مكتبة Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- مكتبة TON Connect للمحفظة -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        .balance-box {
            background: linear-gradient(135deg, #2c3e50, #000000);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0 25px 0;
            border: 1px solid #333;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            color: #ffca28;
            margin-top: 5px;
        }

        .btn-action {
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
            margin-bottom: 10px;
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 87, 34, 0.4);
        }

        .btn-action:disabled {
            background: #424242;
            color: #888888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .timer-text {
            color: #ff9800;
            font-size: 13px;
            margin: 8px 0;
            display: none;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- زر ربط محفظة Tonkeeper -->
        <div id="ton-connect" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>

        <!-- صندوق عرض الرصيد -->
        <div class="balance-box">
            <span style="color: #aaa; font-size: 14px;">رصيدك الحالي</span>
            <div id="moon-balance" class="balance-amount">0 MOON</div>
        </div>

        <hr class="divider">

        <!-- قسم الإعلان والمكافأة -->
        <button id="reward-ad-btn" class="btn-action" onclick="triggerRewardAd()">
            🎁 شاهد إعلان واكسب +2 MOON
        </button>
        <div id="cooldown-timer" class="timer-text"></div>
    </div>

    <script>
        // --- 1. إعدادات Telegram WebApp ---
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // --- 2. إعدادات TON Connect ---
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://kng424157-lab.github.io/usdt-mystery-box/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        // --- 3. ثوابت وإعدادات الإعلان والمكافأة ---
        const ADSTERRA_DIRECT_LINK = "https://www.profitablecpmrate.com/31977587";
        const COOLDOWN_HOURS = 2;
        const COOLDOWN_MS = COOLDOWN_HOURS * 60 * 60 * 1000;
        const REWARD_AMOUNT = 2;

        const rewardBtn = document.getElementById("reward-ad-btn");
        const timerDisplay = document.getElementById("cooldown-timer");
        const balanceDisplay = document.getElementById("moon-balance");

        // استرجاع الرصيد المخزن وعرضه عند بدء التشغيل
        function loadBalance() {
            const savedBalance = parseFloat(localStorage.getItem("moon_balance") || "0");
            balanceDisplay.innerText = `${savedBalance} MOON`;
        }

        // وظيفة الضغط على زر الإعلان
        function triggerRewardAd() {
            const lastClaim = localStorage.getItem("last_moon_ad_claim");
            const now = Date.now();

            if (lastClaim && (now - parseInt(lastClaim)) < COOLDOWN_MS) {
                alert("يرجى الانتظار حتى اكتمال مهلة الساعتين.");
                return;
            }

            // فتح رابط الإعلان في نافذة جديدة
            try {
                window.open(ADSTERRA_DIRECT_LINK, "_blank");
            } catch (e) {
                console.log("تم حظر الإعلان، يتم منح المكافأة مباشرة.");
            }

            // إضافة المكافأة وتحديث الرصيد
            addMoonTokens(REWARD_AMOUNT);

            // تفعيل المؤقت
            localStorage.setItem("last_moon_ad_claim", now.toString());
            updateCooldownState();
        }

        // زيادة الرصيد
        function addMoonTokens(amount) {
            let currentBalance = parseFloat(localStorage.getItem("moon_balance") || "0");
            currentBalance += amount;
            localStorage.setItem("moon_balance", currentBalance.toString());
            balanceDisplay.innerText = `${currentBalance} MOON`;
            alert(`تهانينا! تمت إضافة +${amount} عملة MOON إلى حسابك 🚀`);
        }

        // فحص وتحديث حالة العد التنازلي للزر
        function updateCooldownState() {
            const lastClaim = localStorage.getItem("last_moon_ad_claim");
            if (!lastClaim) return;

            const now = Date.now();
            const diff = now - parseInt(lastClaim);

            if (diff < COOLDOWN_MS) {
                rewardBtn.disabled = true;
                timerDisplay.style.display = "block";

                const remainingMs = COOLDOWN_MS - diff;
                const hours = Math.floor(remainingMs / (1000 * 60 * 60));
                const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);

                timerDisplay.innerText = `⏳ متاح مجدداً بعد: ${hours}س ${minutes}د ${seconds}ث`;
            } else {
                rewardBtn.disabled = false;
                timerDisplay.style.display = "none";
            }
        }

        // تهيئة العداد وعرض الرصيد
        loadBalance();
        setInterval(updateCooldownState, 1000);
        updateCooldownState();
    </script>
</body>
</html>
