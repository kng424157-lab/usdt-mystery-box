<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .box { background: #1e293b; padding: 25px; border-radius: 15px; width: 100%; max-width: 330px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn { background: #3b82f6; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-green { background: #10b981; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎁 صندوق الدولار</h2>
        <p>شاهد الإعلان وادعم اللعبة للحصول على مفتاح!</p>
        <button class="btn btn-green" onclick="openBox()">🔓 افتح الصندوق (مفتاح 1)</button>
        <button class="btn" onclick="watchAd()">📺 شاهد إعلان لكسب مفتاح</button>
        <div id="bal" style="margin-top: 15px; color: #f59e0b; font-weight: bold;">رصيدك: 0.000 USDT | المفاتيح: 1</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.ready(); tg.expand(); }

        let state = { usdt: 0, keys: 1 };

        function updateUI() {
            document.getElementById('bal').innerText = `رصيدك: ${state.usdt.toFixed(3)} USDT | المفاتيح: ${state.keys}`;
        }

        function openBox() {
            if(state.keys <= 0) {
                alert("ليس لديك مفاتيح! شاهد إعلاناً للحصول على مفتاح.");
                return;
            }
            state.keys -= 1;
            state.usdt += 0.010;
            updateUI();
            if(tg) tg.showAlert("🎉 مبروك! ربحت 0.010 USDT");
        }

        function watchAd() {
            if(window.AdsGram) {
                const ad = window.AdsGram.init({ blockId: "56031" });
                ad.show().then(() => {
                    state.keys += 1;
                    updateUI();
                    if(tg) tg.showAlert("🔑 مبروك! حصلت على مفتاح جديد.");
                }).catch(() => {
                    if(tg) tg.showAlert("يجب مشاهدة الإعلان كاملاً!");
                });
            } else {
                alert("مكتبة الإعلانات لم تتحمل بعد، حاول مجدداً.");
            }
        }
    </script>
</body>
</html>
