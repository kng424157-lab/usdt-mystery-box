<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonTap Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            padding: 20px;
        }
        .level-badge {
            background: #f59e0b;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        .mining-box {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .coin-img {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #fde047 0%, #ca8a04 100%);
            border-radius: 50%;
            margin: 20px auto;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.5);
        }
        .balance {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-ad {
            background: #d97706;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="levelDisplay" class="level-badge">⚡ المستوى 1</div>
        
        <div class="mining-box">
            <h3>MoonTap Mining</h3>
            <div class="coin-img"></div>
            <p>مكافأة التعدين غير المطالب بها</p>
            <div id="miningBalance" class="balance">0.0000</div>
            <p id="miningRate">معدل التعدين: 1.15 يومياً</p>
            
            <button class="btn" onclick="claimRewards()">مطالبة بالمكافأة</button>
            <button class="btn btn-ad" onclick="watchAd()">مشاهدة إعلان لمضاعفة السرعة</button>
        </div>
    </div>

    <script>
        // إعدادات المستويات والتعدين اليومي
        const levels = [
            { level: 1, dailyRate: 1.15 },
            { level: 2, dailyRate: 3.50 },
            { level: 3, dailyRate: 10.00 },
            { level: 4, dailyRate: 25.00 },
            { level: 5, dailyRate: 50.00 }
        ];

        let currentLevelIndex = 0; // يمكنك تغييرها حسب مستوى المستخدم (0 = المستوى الأول)
        let minedAmount = 1.1500;

        function updateMiningDisplay() {
            let activeLevel = levels[currentLevelIndex];
            // حساب الزيادة التراكمية الثانية بناءً على المعدل اليومي
            let incrementPerSecond = activeLevel.dailyRate / 86400; 

            setInterval(() => {
                minedAmount += incrementPerSecond;
                document.getElementById('miningBalance').innerText = minedAmount.toFixed(4);
            }, 1000);

            document.getElementById('levelDisplay.innerText` = `⚡ المستوى ${activeLevel.level}`;
            document.getElementById('miningRate').innerText = `معدل التعدين: ${activeLevel.dailyRate} يومياً`;
        }

        function claimRewards() {
            alert("تمت مطالبة الأرباح بنجاح!");
            minedAmount = 0;
        }

        function watchAd() {
            alert("جاري عرض الإعلان لمضاعفة السرعة...");
        }

        // تشغيل العداد عند فتح الصفحة
        updateMiningDisplay();
    </script>
</body>
</html>
