<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoonTap Mining</title>

    <!-- مكتبات تيليجرام والمحفظة -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 90vh;
            user-select: none; /* منع تحديد النص أثناء النقر */
        }
        
        #ton-connect { margin-bottom: 20px; }

        .score-board {
            background: #1e1e1e;
            padding: 15px 40px;
            border-radius: 15px;
            border: 1px solid #333;
            text-align: center;
            margin-bottom: 40px;
            width: 80%;
            max-width: 300px;
        }

        .balance-text { color: #aaa; font-size: 14px; margin-bottom: 5px; }
        .balance-value { font-size: 36px; font-weight: bold; color: #ffca28; }

        /* دائرة التعدين */
        .tap-coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffca28 0%, #f57f17 100%);
            border: 8px solid #3e2723;
            box-shadow: 0 0 40px rgba(255, 202, 40, 0.2), inset 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.05s;
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .tap-coin:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(255, 202, 40, 0.4), inset 0 0 30px rgba(0,0,0,0.7);
        }

        /* قسم الإعلانات */
        .ad-section {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .btn-ad {
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3);
        }

        .btn-ad:disabled {
            background: #424242;
            color: #888;
            box-shadow: none;
        }

        .timer {
            color: #ff9800;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- زر المحفظة -->
    <div id="ton-connect"></div>

    <!-- لوحة الرصيد -->
    <div class="score-board">
        <div class="balance-text">رصيد MOON</div>
        <div id="balance" class="balance-value">0</div>
    </div>

    <!-- زر التعدين المركزي -->
    <div class="tap-coin" onclick="mineMoon()">🌕</div>

    <!-- منطقة الإعلانات -->
    <div class="ad-section">
        <button id="reward-ad-btn" class="btn-ad" onclick="triggerRewardAd()">
            🎁 شاهد إعلان واكسب +2 MOON
        </button>
        <div id="cooldown-timer" class="timer"></div>
    </div>

    <script>
        // تهيئة تيليجرام
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // تهيئة المحفظة
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://kng424157-lab.github.io/usdt-mystery-box/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        // المتغيرات وعناصر الواجهة
        const ADSTERRA_LINK = "https://www.profitablecpmrate.com/31977587";
        const COOLDOWN_MS = 2 * 60 * 60 * 1000;
        let currentBalance = parseFloat(localStorage.getItem("moon_balance") || "0");
        
        const balanceEl = document.getElementById("balance");
        const rewardBtn = document.getElementById("reward-ad-btn");
        const timerDisplay = document.getElementById("cooldown-timer");

        // عرض الرصيد الأولي
        balanceEl.innerText = currentBalance;

        // دالة التعدين (النقر)
        function mineMoon() {
            currentBalance += 1; // زيادة 1 مون لكل نقرة
            balanceEl.innerText = currentBalance;
            localStorage.setItem("moon_balance", currentBalance.toString());
            
            // اهتزاز الهاتف عند النقر إذا كان مدعوماً
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // دالة إعلان المكافأة
        function triggerRewardAd() {
            const lastClaim = localStorage.getItem("last_moon_ad_claim");
            const now = Date.now();

            if (lastClaim && (now - parseInt(lastClaim)) < COOLDOWN_MS) return;

            // فتح الإعلان
            try { window.open(ADSTERRA_LINK, "_blank"); } catch(e) {}

            // منح المكافأة
            currentBalance += 2;
            balanceEl.innerText = currentBalance;
            localStorage.setItem("moon_balance", currentBalance.toString());
            localStorage.setItem("last_moon_ad_claim", now.toString());
            
            updateCooldownState();
        }

        // تحديث عداد الساعتين للإعلان
        function updateCooldownState() {
            const lastClaim = localStorage.getItem("last_moon_ad_claim");
            if (!lastClaim) return;

            const diff = Date.now() - parseInt(lastClaim);

            if (diff < COOLDOWN_MS) {
                rewardBtn.disabled = true;
                timerDisplay.style.display = "block";

                const remainingMs = COOLDOWN_MS - diff;
                const hours = Math.floor(remainingMs / (1000 * 60 * 60));
                const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);

                timerDisplay.innerText = `⏳ متاح بعد: ${hours}س ${minutes}د ${seconds}ث`;
            } else {
                rewardBtn.disabled = false;
                timerDisplay.style.display = "none";
            }
        }

        setInterval(updateCooldownState, 1000);
        updateCooldownState();
    </script>
</body>
</html>
