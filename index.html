<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Mystery Box</title>
    <!-- تضمين سكريبت تيليجرام للويب آب -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- تضمين مكتبة إعلانات AdsGram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #059669;
        }
        #balance {
            margin-top: 20px;
            font-size: 18px;
            color: #facc15;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎁 صندوق الدولار (USDT)</h1>
        <p>شاهد الإعلان وادعم اللعبة لفتح الصندوق والحصول على مكافآت فورية!</p>
        
        <button class="btn" onclick="showRewardedAd()">مشاهدة إعلان 🎥 وفتح صندوق</button>
        
        <div id="balance">رصيدك: 0 USDT</div>
    </div>

    <script>
        // تهيئة منصة تيليجرام ويب آب
        let tg = window.Telegram.WebApp;
        tg.expand();

        // تهيئة وحدة إعلانات AdsGram بالمعرف الخاص بك (56031)
        const AdController = window.AdsGram.init({ blockId: "56031" });

        // دالة عرض الإعلان المكافئ
        function showRewardedAd() {
            AdController.show().then((result) => {
                // نجاح مشاهدة الإعلان بالكامل
                console.log("Ad watched successfully", result);
                
                // تنفيذ دالة منح المكافأة للمستخدم
                grantReward();
                
            }).catch((result) => {
                // خطأ أو قام المستخدم بإغلاق الإعلان مبكراً
                console.log("Ad was not completed", result);
                tg.showAlert("يجب مشاهدة الإعلان كاملاً لكي تحصل على المكافأة!");
            });
        }

        // دالة إضافة المكافأة وتحديث الواجهة
        let userBalance = 0;
        function grantReward() {
            userBalance += 1; // زيادة رصيد تجريبي بمقدار 1 USDT
            document.getElementById("balance").innerText = "رصيدك: " + userBalance + " USDT";
            tg.showAlert("🎉 مبروك! حصلت على مكافأة الصندوق بنجاح.");
        }
    </script>

</body>
</html>
